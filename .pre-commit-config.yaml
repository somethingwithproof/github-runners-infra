repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Go itself is pinned by go.mod/toolchain.
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: gofmt -w
        language: system
        types: [go]
      - id: go-build
        name: go build ./...
        entry: go build ./...
        language: system
        pass_filenames: false
        files: '(^|/)(.*\.go|go\.(mod|sum))$'

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint-full

  - repo: local
    hooks:
      - id: go-vet-all
        name: go vet ./...
        entry: go vet ./...
        language: system
        pass_filenames: false
        files: '(^|/)(.*\.go|go\.(mod|sum))$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
